[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-image-to-video-animator"
version = "0.9.2"
description = "Windows desktop plugin host for AI image-to-video animation pipelines."
readme = "docs/README_INTERNAL.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "animator-host maintainers" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "pydantic>=2.7",
    "tomli>=2.0; python_version < '3.11'",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
cuda = ["torch>=2.4", "diffusers>=0.30"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "black>=24.4", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
animator = "animator_host.cli:app"

[project.entry-points."animator.plugins"]
motion_diffusion = "extensions.motion_diffusion.plugin:MotionDiffusionPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/animator_host"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]